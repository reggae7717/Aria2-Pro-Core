name: Aria2 Builder

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        PLATFORMS: [next-amd64]
        include:
        - PLATFORMS: next-amd64
          BUILDER_IMAGE: ubuntu:24.04
          BUILD_SCRIPT: aria2-next-gnu-linux-build.sh
          BINARY_NAME: aria2-next

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      env:
        DOCKER_BUILDKIT: 1
        BUILDER_IMAGE: ${{ matrix.BUILDER_IMAGE }}
        BUILD_SCRIPT: ${{ matrix.BUILD_SCRIPT }}
      run: |
        docker build \
          --build-arg BUILDER_IMAGE \
          --build-arg BUILD_SCRIPT \
          --platform=local \
          -o ./output . \
          2>&1 | tee build.log

    - name: Output Error Log
      if: (!cancelled())
      run: grep -iE 'fatal|error|critical|failure|warning' build.log || true

    - name: Check Version
      run: |
        tar xzvf ./output/aria2*.tar.gz
        file ${{ matrix.BINARY_NAME }} 2>&1 | tee ./output/file-type-${{ matrix.PLATFORMS }}.txt
        ./${{ matrix.BINARY_NAME }} -v 2>&1 | tee ./output/version-${{ matrix.PLATFORMS }}.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2-${{ matrix.PLATFORMS }}
        path: output

    - name: Functional Testing
      run: |
        ./${{ matrix.BINARY_NAME }} https://raw.githubusercontent.com/P3TERX/aria2.conf/master/dht.dat
        ./${{ matrix.BINARY_NAME }} https://raw.githubusercontent.com/P3TERX/aria2.conf/master/dht6.dat
        ./${{ matrix.BINARY_NAME }} \
          --seed-time=0 \
          --enable-dht6=true \
          --dht-file-path="$PWD/dht.dat" \
          --dht-file-path6="$PWD/dht6.dat" \
          --dht-entry-point='dht.transmissionbt.com:6881' \
          --dht-entry-point6='dht.transmissionbt.com:6881' \
          "$(curl -fsSL https://ubuntu.com/download/alternative-downloads | grep -o 'https.*server.*torrent' | head -1)"